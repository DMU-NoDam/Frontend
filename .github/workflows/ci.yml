name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy to Nginx server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: nodam.duckdns.org
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            rm -rf /home/ubuntu/dist

      - name: Copy dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: nodam.duckdns.org
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist/"
          target: /home/ubuntu

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: nodam.duckdns.org
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sudo rm -rf /var/www/html/dist
            sudo mv /home/ubuntu/dist /var/www/html/dist
            sudo chmod -R 755 /var/www/html/dist
            sudo nginx -t && sudo systemctl reload nginx
            echo "=== Deploy complete ==="
